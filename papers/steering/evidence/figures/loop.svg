<text x="412.5" y="56.5" font-size="10" fill="#2e7d32" text-anchor="middle">kept: stays in band — verdict per line, no move needed</text>
<text x="60" y="300" font-size="11" fill="#777">Receipts live per cell: refusal at the unmeasured edge (S4); the composed serve and its judged lines (S1, S2 x5);</text>
<text x="60" y="318" font-size="11" fill="#777">rounds and their cost against the quiet stretches between world moves (D2); survival of a declared move (D1, the 2026-11-01 battery).</text>
