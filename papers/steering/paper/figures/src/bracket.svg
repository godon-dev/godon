<svg xmlns="http://www.w3.org/2000/svg" width="940" height="330" font-family="Helvetica,Arial,sans-serif">
<rect width="940" height="330" fill="white"/>
<text x="470" y="30" font-size="17" fill="#222" text-anchor="middle" font-weight="bold">The kept fraction over four hours: luck, keeper, hindsight</text>
<text x="16" y="97" font-size="15" fill="#333">doing nothing (luck)</text>
<line x1="250" y1="92" x2="900" y2="92" stroke="#dddddd" stroke-width="1.5"/>
<circle cx="258" cy="92" r="11" fill="#c62828"/>
<text x="276" y="98" font-size="16" fill="#c62828" font-weight="bold">0.013</text>
<text x="16" y="155" font-size="15" fill="#333">what we tended</text>
<line x1="250" y1="150" x2="900" y2="150" stroke="#dddddd" stroke-width="1.5"/>
<circle cx="757" cy="150" r="11" fill="#2e7d32"/>
<text x="775" y="156" font-size="16" fill="#2e7d32" font-weight="bold">0.874</text>
<text x="16" y="213" font-size="15" fill="#333">perfect hindsight</text>
<text x="16" y="231" font-size="11" fill="#999">computed after the fact, never flown</text>
<line x1="250" y1="208" x2="900" y2="208" stroke="#dddddd" stroke-width="1.5"/>
<circle cx="830" cy="208" r="10" fill="white" stroke="#795548" stroke-width="3.5"/>
<text x="848" y="214" font-size="16" fill="#795548" font-weight="bold">1.000</text>
<line x1="250" y1="246" x2="900" y2="246" stroke="#999999" stroke-width="1.5"/>
<line x1="250" y1="240" x2="250" y2="252" stroke="#999999"/>
<text x="250" y="270" font-size="12" fill="#666" text-anchor="middle">0</text>
<line x1="395" y1="240" x2="395" y2="252" stroke="#999999"/>
<text x="395" y="270" font-size="12" fill="#666" text-anchor="middle">0.25</text>
<line x1="540" y1="240" x2="540" y2="252" stroke="#999999"/>
<text x="540" y="270" font-size="12" fill="#666" text-anchor="middle">0.5</text>
<line x1="685" y1="240" x2="685" y2="252" stroke="#999999"/>
<text x="685" y="270" font-size="12" fill="#666" text-anchor="middle">0.75</text>
<line x1="830" y1="240" x2="830" y2="252" stroke="#999999"/>
<text x="830" y="270" font-size="12" fill="#666" text-anchor="middle">1.0</text>
<text x="16" y="322" font-size="12" fill="#555">No external keeper appears; the two anchors make the keeper's number readable on its own (Section 4).</text>
</svg>
