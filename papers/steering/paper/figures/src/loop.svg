<text x="370" y="108" font-size="13" fill="#222" text-anchor="middle">COMPILED AGAINST</text>
<text x="370" y="123" font-size="13" fill="#222" text-anchor="middle">THE MEASURED MAP</text>
<rect x="520" y="84" width="180" height="52" rx="8" fill="#eef4fb" stroke="#3a6ea5" stroke-width="1.5"/>
