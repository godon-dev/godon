<text x="740" y="72" font-size="12" fill="#2e7d32" text-anchor="end">in band: the verdict is KEPT, no move needed - the loop rests</text>
<text x="40" y="380" font-size="12" fill="#666">Green: the kept path. Red/brown: the repair path the drift forces. Every arrow above is receipted in Section 5.</text>
