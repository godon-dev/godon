<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="526" font-family="Helvetica,Arial,sans-serif">
<rect width="1010" height="526" fill="white"/>
<text x="505" y="30" font-size="17" fill="#222" text-anchor="middle" font-weight="bold">The same scenario, five times --- repetition is the point</text>
<text x="16" y="100" font-size="13" fill="#333">S2-a</text>
<line x1="210" y1="96" x2="900" y2="96" stroke="#cccccc" stroke-width="1" stroke-dasharray="2 4"/>
<circle cx="224" cy="96" r="5" fill="#888888"/>
<text x="224" y="118" font-size="11" fill="#666" text-anchor="middle">declared</text>
<circle cx="334" cy="96" r="5" fill="#3a6ea5"/>
<text x="334" y="118" font-size="11" fill="#666" text-anchor="middle">planned</text>
<rect x="918" y="82" width="80" height="26" rx="13" fill="#2e7d32"/>
<text x="958" y="100" font-size="12" fill="#ffffff" text-anchor="middle">LANDED</text>
<text x="400" y="92" font-size="12" fill="#333">margins 0.047 / 0.063 above the band floor</text>
<text x="400" y="110" font-size="11" fill="#999">timeline lost at collection; verdict from the flight log</text>
<text x="16" y="180" font-size="13" fill="#333">S2-b</text>
<line x1="210" y1="176" x2="900" y2="176" stroke="#cccccc" stroke-width="1" stroke-dasharray="2 4"/>
<circle cx="224" cy="176" r="5" fill="#888888"/>
<text x="224" y="198" font-size="11" fill="#666" text-anchor="middle">declared</text>
<circle cx="334" cy="176" r="5" fill="#3a6ea5"/>
<text x="334" y="198" font-size="11" fill="#666" text-anchor="middle">planned</text>
<rect x="918" y="162" width="80" height="26" rx="13" fill="#b35900"/>
<text x="958" y="180" font-size="12" fill="#ffffff" text-anchor="middle">MISSED</text>
<text x="400" y="172" font-size="12" fill="#333">0.004 over the edge; declared 4 h late --- an operator artifact</text>
<text x="16" y="260" font-size="13" fill="#333">S2-c</text>
<line x1="210" y1="256" x2="900" y2="256" stroke="#cccccc" stroke-width="1" stroke-dasharray="2 4"/>
<circle cx="224" cy="256" r="5" fill="#888888"/>
<text x="224" y="278" font-size="11" fill="#666" text-anchor="middle">declared</text>
<circle cx="334" cy="256" r="5" fill="#3a6ea5"/>
<text x="334" y="278" font-size="11" fill="#666" text-anchor="middle">planned</text>
<rect x="918" y="242" width="80" height="26" rx="13" fill="#2e7d32"/>
<text x="958" y="260" font-size="12" fill="#ffffff" text-anchor="middle">LANDED</text>
<text x="400" y="252" font-size="12" fill="#333">an honest undecidable first window, then in band</text>
<text x="16" y="340" font-size="13" fill="#333">S2-d</text>
<line x1="210" y1="336" x2="900" y2="336" stroke="#cccccc" stroke-width="1" stroke-dasharray="2 4"/>
<circle cx="224" cy="336" r="5" fill="#888888"/>
<text x="224" y="358" font-size="11" fill="#666" text-anchor="middle">declared</text>
<circle cx="334" cy="336" r="5" fill="#3a6ea5"/>
<text x="334" y="358" font-size="11" fill="#666" text-anchor="middle">planned</text>
<rect x="918" y="322" width="80" height="26" rx="13" fill="#2e7d32"/>
<text x="958" y="340" font-size="12" fill="#ffffff" text-anchor="middle">LANDED</text>
<text x="400" y="332" font-size="12" fill="#333">above the floor; bar 0.0064</text>
<text x="16" y="420" font-size="13" fill="#333">S2-e</text>
<line x1="210" y1="416" x2="900" y2="416" stroke="#cccccc" stroke-width="1" stroke-dasharray="2 4"/>
<circle cx="224" cy="416" r="5" fill="#888888"/>
<text x="224" y="438" font-size="11" fill="#666" text-anchor="middle">declared</text>
<circle cx="334" cy="416" r="5" fill="#3a6ea5"/>
<text x="334" y="438" font-size="11" fill="#666" text-anchor="middle">planned</text>
<rect x="918" y="402" width="80" height="26" rx="13" fill="#2e7d32"/>
<text x="958" y="420" font-size="12" fill="#ffffff" text-anchor="middle">LANDED</text>
<text x="400" y="412" font-size="12" fill="#333">both lines mid-band</text>
<text x="400" y="430" font-size="11" fill="#999">timeline lost at collection; verdict from the record</text>
<text x="16" y="496" font-size="12" fill="#555">Every lane is the same run shape: same promise, same band, no scheduled drift (the run-shapes table, first row).</text>
<text x="16" y="514" font-size="12" fill="#555">Only the outcome differs --- four land, one misses at the edge. Full timelines live in the evidence bundles.</text>
</svg>
