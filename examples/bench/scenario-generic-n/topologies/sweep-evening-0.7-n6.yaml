  - id: node-6
    params: 1
    objectives: 1
    base: linear
    param_lower: 0.0
    param_upper: 100.0
    weights:
      - [1.0]
    drifts:
      - name: evening-slide
        rate_per_second: 0.006
        cap: 1.0
        when:
          seconds: 300
    morphs:
      - clock: wall
        at_secs: 600.0
        travel_secs: 120.0
        target_weights: [[1.6]]
    exogenous:
      - kind: step
        amplitude: 0.15
        objective: 0
        at_tick: 0
        travel_ticks: 60
