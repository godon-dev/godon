# The P5 sweep world: knee-morph (cell 3) — mesh-0.7-n6 base, one declared event.
# Base (identical in every sweep file unless the event says otherwise):
# 6 nodes, 1 dial + 1 objective each, linear base, weights [1.0], edges
# all-pairs i<j at strength 0.7 (15 edges), noise sigma 0.02. The event
# block is the cell's whole subject; the story point (tick 360 / secs
# cues) sits after the map builds. Terms: node-6 base linear -> saturation, wall clock, at_secs 420, travel_secs 60;
# the bench's own blend test names this pair. Amended 2026-11-27 (one commit, the diff is the receipt): the cue sat
# at 240 s since 2026-11-20. On the cured engine (rooms of 2026-11-26) the first map completes at uptime 210-343 s;
# 420 s = the slowest seen plus ~70 s against boot variance.
