# Topology: 2-node pair, coupled noise — noise floor validation
#
# Same edge as scenario-generic-pair but with stacked noise:
# gaussian jitter + colored drift. Tests whether detection holds
# when the baseline has structure (colored noise mimics thermal inertia).
# Sweep colored_sigma from 0.0 to 0.20 to find the detection floor.

nodes:
  - id: node-1
    params: 3
    objectives: 2
    base: linear
    param_lower: 0.0
    param_upper: 100.0
    weights:
      - [0.3, 0.5, 0.2]
      - [0.1, 0.4, 0.5]

  - id: node-2
    params: 3
    objectives: 2
    base: linear
    param_lower: 0.0
    param_upper: 100.0
    weights:
      - [0.4, 0.3, 0.3]
      - [0.2, 0.6, 0.2]

edges:
  - from: node-1
    from_channel: 0
    to: node-2
    to_channel: 0
    strength: 0.7

noise:
  gaussian_sigma: 0.02
  colored_sigma: 0.05
  drift_rate: 0.0
