# Topology: 4-node chain, linear coupling — composition validation
#
# Ground truth: node-1 → node-2 (0.7) → node-3 (0.5) → node-4 (0.3)
#
# Composition test: perturbing node-1 should shift node-4 at
# 0.7 × 0.5 × 0.3 = 0.105 (if linear composition holds exactly)
#
# This is the KEYSTONE experiment. If the scanner recovers each edge
# independently and forward simulation predicts the chain response,
# the entire arc opens.

nodes:
  - id: node-1
    params: 3
    objectives: 2
    base: linear
    param_lower: 0.0
    param_upper: 100.0
    weights:
      - [0.3, 0.5, 0.2]
      - [0.1, 0.4, 0.5]

  - id: node-2
    params: 3
    objectives: 2
    base: linear
    param_lower: 0.0
    param_upper: 100.0
    weights:
      - [0.4, 0.3, 0.3]
      - [0.2, 0.6, 0.2]

  - id: node-3
    params: 3
    objectives: 2
    base: linear
    param_lower: 0.0
    param_upper: 100.0
    weights:
      - [0.2, 0.6, 0.2]
      - [0.3, 0.3, 0.4]

  - id: node-4
    params: 3
    objectives: 2
    base: linear
    param_lower: 0.0
    param_upper: 100.0
    weights:
      - [0.5, 0.3, 0.2]
      - [0.2, 0.5, 0.3]

edges:
  - from: node-1
    from_channel: 0
    to: node-2
    to_channel: 0
    strength: 0.7

  - from: node-2
    from_channel: 0
    to: node-3
    to_channel: 0
    strength: 0.5

  - from: node-3
    from_channel: 0
    to: node-4
    to_channel: 0
    strength: 0.3

noise:
  gaussian_sigma: 0.02
  colored_sigma: 0.0
  drift_rate: 0.0
