# Topology: 2-node pair, nonlinear (saturation) — non-linearity validation
#
# Same as the pair scenario but the response saturates at extremes.
# Edge measured at baseline (mid-range) predicts too much shift when
# sender pushes to extremes (flat part of saturation curve).
# Tests whether the scanner detects coupling on S-curve responses
# and how much the measured weight diverges from the true strength.

nodes:
  - id: node-1
    params: 3
    objectives: 2
    base: saturation
    param_lower: 0.0
    param_upper: 100.0
    weights:
      - [0.5, 0.5, 0.5]
      - [0.3, 0.4, 0.3]

  - id: node-2
    params: 3
    objectives: 2
    base: saturation
    param_lower: 0.0
    param_upper: 100.0
    weights:
      - [0.4, 0.3, 0.3]
      - [0.2, 0.6, 0.2]

edges:
  - from: node-1
    from_channel: 0
    to: node-2
    to_channel: 0
    strength: 0.7

noise:
  gaussian_sigma: 0.02
  colored_sigma: 0.0
  drift_rate: 0.0
