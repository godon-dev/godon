meta:
  configVersion: "0.3"
  strict_validation: false

systemtender:
  type: "bench_generic"

settings:
  generic:
    param_0:
      constraints:
        - {step: 5.0, lower: 0.0, upper: 100.0}
    param_1:
      constraints:
        - {step: 5.0, lower: 0.0, upper: 100.0}

run:
  parallel: 1
interference_detection:
  # walk retirement bar (default 0.02): the holder's relaxation lever —
  # retire params on coarser certificates so walks conclude inside a room
  convergence_threshold: 0.1
  group: bench-wish-stack
  mode: active
  min_optimize_trials: 15
  hold_calib_trials: 5
  push_block_size: 15
  pause_block_size: 15
  cooldown_trials: 5
  hold_params:
    param_0: 50.0
    param_1: 50.0

reconnaissance:
  type: http
  http:
    url: "http://bench-wish-stack:8090/node-2"

objectives:
  - name: "objective_0"
    direction: maximize
    reconnaissance:
      service: http
      path: /metrics/json
      key: objective_0
      stabilization_seconds: 0
      samples: 3
      interval: 0
      aggregation: median

rollback_strategies:
  standard:
    consecutive_failures: 10
    target_state: "previous"
    max_attempts: 3
    on_failure: "continue"
    timeout_seconds: 60
    after:
      action: continue

effectuation:
  type: http
  targetRefs:
    - "wish-stack-node-2"
  endpoint_config:
    method: POST
    path: /apply
    timeout_seconds: 30
