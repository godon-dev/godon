nodes:
  # node-1 is the watched node (2 objectives; the wish's receiver sits
  # here). It alone carries the scheduled offset drift — the canonical
  # re-walk shape: the readout holds still while the map builds and
  # the wish lands, then slides on schedule, to a destination (cap).
  #
  # MINIMAL (godon#423, the demo shape): ONE dial per node — the walk's
  # level grid collapses to the coarse pass (~5 levels) and concludes
  # in minutes, which every 3-dial room (10 receipts) could not do in
  # 25-90 min: the grid x latency arithmetic (levels 202-303 measured
  # at room nine's close). The coupling story is unchanged — same
  # edges, same objectives, the wish still rides node-1/objective_1.
  - id: node-1
    params: 1
    objectives: 2
    base: linear
    param_lower: 0.0
    param_upper: 100.0
    offset_drift_rate: 0.0
    offset_drift_start_tick: 0
    offset_drift_cap: null
    weights:
      - [0.7]
      - [0.6]

  - id: node-2
    params: 1
    objectives: 1
    base: linear
    param_lower: 0.0
    param_upper: 100.0
    weights:
      - [1.0]

  - id: node-3
    params: 1
    objectives: 1
    base: linear
    param_lower: 0.0
    param_upper: 100.0
    weights:
      - [1.0]

edges:
  # node-1's dials reach node-2's aim: the neighbour-claim corridor
  - from: node-1
    from_channel: 0
    to: node-2
    to_channel: 0
    strength: 0.7
    drift_rate: 0.0
  # node-1's dials reach the price: the term corridor
  - from: node-1
    from_channel: 0
    to: node-3
    to_channel: 0
    strength: 0.7
    drift_rate: 0.0
  # reverse reach: the room stays one
  - from: node-3
    from_channel: 0
    to: node-1
    to_channel: 1
    strength: 0.7
    drift_rate: 0.0

noise:
  gaussian_sigma: 0.02
  colored_sigma: 0.0
  drift_rate: 0.0
