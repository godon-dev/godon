name: "Bench Characterization — Single Carrier Param"

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Scenario dir under examples/bench/ (characterization | characterization-saturation)"
        required: false
        default: "characterization"
      strength:
        description: "Override edge strength in topology (all edges; empty = conf value stands)"
        required: false
        default: ""
      base:
        description: "Override sender node base (first base line: linear | saturation | threshold | polynomial)"
        required: false
        default: ""
      gaussian_sigma:
        description: "Override noise.gaussian_sigma"
        required: false
        default: ""
      colored_sigma:
        description: "Override noise.colored_sigma"
        required: false
        default: ""
      noise_drift_rate:
        description: "Override noise.drift_rate (growing noise)"
        required: false
        default: ""
      edge_drift_rate:
        description: "Override edge drift_rate (drifting strength; needs a scenario with the field present)"
        required: false
        default: ""
      iterations_max:
        description: "Override breeder conf iterations.max (empty = conf value stands)"
        required: false
        default: ""
      seed:
        description: "GENERIC_SEED for the bench container"
        required: false
        default: "42"
      max_wait_minutes:
        description: "Watchdog timeout in minutes (must exceed the breeder timing budget)"
        required: false
        default: "90"

jobs:
  bench-characterization:
    name: "Characterization: scenario breeders -> coupling curves"
    runs-on: [self-hosted, linux]
    timeout-minutes: ${{ fromJSON(inputs.max_wait_minutes) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Verify KIND Cluster
        run: |
          if ! kind get clusters | grep -q "godon-1-cluster"; then
            echo "KIND cluster not found. Run setup workflows first."
            exit 1
          fi
          kind export kubeconfig --name=godon-1-cluster --kubeconfig=/tmp/kind_kubeconfig.yaml

      - name: Verify Godon Stack
        env:
          KUBECONFIG: /tmp/kind_kubeconfig.yaml
        run: |
          if ! helm status godon --namespace godon >/dev/null 2>&1; then
            echo "Godon stack not found."
            exit 1
          fi
          kubectl wait --for=condition=ready pod -l component=api -n godon --timeout=300s

      - name: Start Characterization Bench Target
        run: |
          SCENARIO_DIR="examples/bench/scenario-${{ inputs.scenario }}"
          echo "Scenario: ${SCENARIO_DIR}"
          cp ${SCENARIO_DIR}/topology.yaml /tmp/topology.yaml

          apply_override() {
            local LABEL=$1 VALUE=$2 GUARD_RE=$3 SED_EXPR=$4 EXPECT=$5
            [ -z "${VALUE}" ] && return 0
            case "${VALUE}" in ''|*[!0-9.A-Za-z_-]*)
              echo "Override ${LABEL}: illegal value '${VALUE}'" >&2; exit 1;;
            esac
            local N=$(grep -cE "${GUARD_RE}" /tmp/topology.yaml || true)
            if [ "${EXPECT}" = "one" ] && [ "${N}" != "1" ]; then
              echo "Override ${LABEL}: expected exactly 1 matching line, found ${N}" >&2; exit 1
            fi
            if [ "${EXPECT}" = "any" ] && [ "${N}" -lt 1 ] 2>/dev/null; then
              echo "Override ${LABEL}: no matching lines found" >&2; exit 1
            fi
            sed -i -E "${SED_EXPR}" /tmp/topology.yaml
            echo "Overrode ${LABEL} -> ${VALUE} (${N} line(s))"
          }

          apply_override "strength"        "${{ inputs.strength }}"        '^    strength: [0-9.]+'       "s/^(    strength: )[0-9.]+/\1${{ inputs.strength }}/"       "any"
          apply_override "base"            "${{ inputs.base }}"            '^[[:space:]]*base: [a-z]+$'  "0,/^([[:space:]]*base: )[a-z]+$/s##\1${{ inputs.base }}#"        "any"
          apply_override "gaussian_sigma"  "${{ inputs.gaussian_sigma }}"  '^  gaussian_sigma: [0-9.]+'   "s/^(  gaussian_sigma: )[0-9.]+/\1${{ inputs.gaussian_sigma }}/"   "one"
          apply_override "colored_sigma"   "${{ inputs.colored_sigma }}"   '^  colored_sigma: [0-9.]+'    "s/^(  colored_sigma: )[0-9.]+/\1${{ inputs.colored_sigma }}/"    "one"
          apply_override "noise_drift_rate" "${{ inputs.noise_drift_rate }}" '^  drift_rate: [0-9.]+'     "s/^(  drift_rate: )[0-9.]+/\1${{ inputs.noise_drift_rate }}/"     "one"
          apply_override "edge_drift_rate" "${{ inputs.edge_drift_rate }}" '^    drift_rate: [0-9.]+'    "s/^(    drift_rate: )[0-9.]+/\1${{ inputs.edge_drift_rate }}/"    "one"

          echo "=== Topology (ground truth, post-overrides) ==="
          cat /tmp/topology.yaml

          echo "Removing any existing bench container..."
          docker rm -f bench-generic 2>/dev/null || true

          docker create \
            --name bench-generic \
            --user 0:0 \
            -p 8090:8090 \
            -e CONFIG_PATH=/topology.yaml \
            -e PORT=8090 \
            -e GENERIC_SEED=${{ inputs.seed }} \
            -e RUST_LOG=info \
            ghcr.io/godon-dev/godon-bench-generic:0.2.1

          docker cp /tmp/topology.yaml bench-generic:/topology.yaml
          docker start bench-generic

          echo "Waiting for generic bench..."
          for i in $(seq 1 30); do
            if curl -s -f --connect-timeout 2 http://127.0.0.1:8090/health >/dev/null 2>&1; then
              echo "Bench healthy"
              curl -s http://127.0.0.1:8090/health | jq '.'
              break
            fi
            sleep 2
          done

          docker network connect kind bench-generic 2>/dev/null || true
          BENCH_IP=$(docker inspect bench-generic -f '{{.NetworkSettings.Networks.kind.IPAddress}}')
          echo "Bench KIND IP: ${BENCH_IP}"
          echo "BENCH_IP=${BENCH_IP}" >> $GITHUB_ENV

      - name: Port Forward to Godon API
        env:
          KUBECONFIG: /tmp/kind_kubeconfig.yaml
        run: |
          fuser -k 9090/tcp 2>/dev/null || true
          sleep 1

          API_POD=$(kubectl get pods -n godon -l component=api -o jsonpath='{.items[0].metadata.name}')
          kubectl port-forward -n godon --address 127.0.0.3 "${API_POD}" 9090:8080 > /tmp/pf.log 2>&1 &
          echo $! > /tmp/pf_pid
          sleep 3

          for i in $(seq 1 30); do
            if curl -s -f --connect-timeout 2 http://127.0.0.3:9090/health >/dev/null 2>&1; then
              echo "API is healthy"
              break
            fi
            sleep 2
          done

          echo "API_HOST=127.0.0.3" >> $GITHUB_ENV
          echo "API_PORT=9090" >> $GITHUB_ENV

      - name: Create Targets
        run: |
          API_URL="http://${{ env.API_HOST }}:${{ env.API_PORT }}"
          CLI_IMAGE="ghcr.io/godon-dev/godon-cli:latest"
          BENCH_URL="http://${{ env.BENCH_IP }}:8090"

          rm -f /tmp/breeder_*_uuid /tmp/target_*_id

          create_target() {
            local NAME=$1
            local NODE_PATH=$2
            local TEMPLATE=$3
            local FILE=$4
            local OUTFILE=$5

            EXISTING=$(curl -s ${API_URL}/targets | jq -r ".[] | select(.name==\"${NAME}\") | .id" 2>/dev/null || echo "")
            if [ -n "${EXISTING}" ]; then
              echo "Deleting existing target: ${EXISTING}" >&2
              curl -s -X DELETE ${API_URL}/targets/${EXISTING} >/dev/null 2>&1 || true
            fi

            sed -E -e "s|http://bench-generic:8090/node-[0-9]+|${BENCH_URL}/${NODE_PATH}|g" \
              ${TEMPLATE} > ${FILE}
            chmod 644 ${FILE}

            echo "Creating target ${NAME}..." >&2
            CREATE_OUTPUT=$(docker run --rm --network host \
              -v $(pwd):/work:ro -w /work \
              "${CLI_IMAGE}" --hostname=${{ env.API_HOST }} --port=${{ env.API_PORT }} --insecure \
              target create --file=${FILE} 2>&1 || true)
            echo "${CREATE_OUTPUT}" >&2

            local ID=$(echo "${CREATE_OUTPUT}" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1)
            if [ -z "${ID}" ]; then
              ID=$(curl -s ${API_URL}/targets | jq -r ".[] | select(.name==\"${NAME}\") | .id" 2>/dev/null || echo "")
            fi
            if [ -z "${ID}" ]; then
              echo "Failed to create target ${NAME}" >&2
              exit 1
            fi
            echo "Target ${NAME}: ${ID}" >&2
            echo "${ID}" > "${OUTFILE}"
          }

          for TCFG in $(ls examples/bench/scenario-${{ inputs.scenario }}/targets/node-*.yaml | sort); do
            NODE_NUM=$(basename "${TCFG}" .yaml | sed 's/node-//')
            create_target "bench-char-node-${NODE_NUM}" "node-${NODE_NUM}" \
              "${TCFG}" "target-node-${NODE_NUM}.yaml" "/tmp/target_${NODE_NUM}_id"
          done

      - name: Create Breeders
        env:
          KUBECONFIG: /tmp/kind_kubeconfig.yaml
        run: |
          API_URL="http://${{ env.API_HOST }}:${{ env.API_PORT }}"
          CLI_IMAGE="ghcr.io/godon-dev/godon-cli:latest"
          BENCH_URL="http://${{ env.BENCH_IP }}:8090"

          # Purge any existing bench-char breeders first
          EXISTING_BREEDERS=$(curl -s ${API_URL}/breeders | jq -r ".[] | select(.name | startswith(\"bench-char\")) | .id" 2>/dev/null || echo "")
          for BID in ${EXISTING_BREEDERS}; do
            echo "Purging existing bench-char breeder: ${BID}" >&2
            docker run --rm --network host "${CLI_IMAGE}" \
              --hostname=${{ env.API_HOST }} --port=${{ env.API_PORT }} --insecure \
              breeder purge --force --id="${BID}" 2>/dev/null || true
          done

          create_breeder() {
            local NAME=$1
            local TARGET_ID=$2
            local RECON_URL=$3
            local NODE_NUM=$4
            local OUTFILE=$5

            sed -E -e "s|http://bench-generic:8090/node-[0-9]+|${RECON_URL}|g" \
                   -e "s/\"generic-node-[0-9]+\"/\"${TARGET_ID}\"/g" \
              examples/bench/scenario-${{ inputs.scenario }}/breeders/breeder-${NODE_NUM}.yml > breeder-config-${NODE_NUM}.yaml

            if [ -n "${{ inputs.iterations_max }}" ]; then
              MAX_LINES=$(grep -cE '^[[:space:]]*max: [0-9]+' "breeder-config-${NODE_NUM}.yaml" || true)
              if [ "${MAX_LINES}" != "1" ]; then
                echo "Expected exactly one iterations.max line in breeder-config-${NODE_NUM}.yaml, found ${MAX_LINES}" >&2
                exit 1
              fi
              sed -i -E "s/^([[:space:]]*max: )[0-9]+/\1${{ inputs.iterations_max }}/" "breeder-config-${NODE_NUM}.yaml"
              echo "Overrode iterations.max -> ${{ inputs.iterations_max }} for ${NAME}" >&2
            fi

            chmod 644 breeder-config-${NODE_NUM}.yaml

            local UUID=""
            for ATTEMPT in 1 2 3 4 5; do
              echo "Creating breeder ${NAME} (attempt ${ATTEMPT})..." >&2

              UUID=$(curl -s ${API_URL}/breeders | jq -r ".[] | select(.name==\"${NAME}\") | .id" 2>/dev/null | head -1 || echo "")
              if [ -n "${UUID}" ]; then
                echo "Breeder ${NAME} already exists: ${UUID}" >&2
                break
              fi

              CREATE_OUTPUT=$(docker run --rm --network host \
                -v $(pwd):/work -w /work \
                "${CLI_IMAGE}" --hostname=${{ env.API_HOST }} --port=${{ env.API_PORT }} --insecure \
                breeder create --name="${NAME}" --file=breeder-config-${NODE_NUM}.yaml 2>&1 || true)
              echo "${CREATE_OUTPUT}" >&2

              UUID=$(echo "${CREATE_OUTPUT}" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1)
              if [ -n "${UUID}" ]; then
                break
              fi
              sleep 10
            done

            if [ -z "${UUID}" ]; then
              echo "Failed to create breeder ${NAME}" >&2
              exit 1
            fi
            echo "Breeder ${NAME}: ${UUID}" >&2
            echo "${UUID}" > "${OUTFILE}"
          }

          for BCFG in $(ls examples/bench/scenario-${{ inputs.scenario }}/breeders/breeder-*.yml | sort); do
            NODE_NUM=$(basename "${BCFG}" .yml | sed 's/breeder-//')
            create_breeder "bench-char-${NODE_NUM}" "$(cat /tmp/target_${NODE_NUM}_id)" \
              "${BENCH_URL}/node-${NODE_NUM}" "${NODE_NUM}" "/tmp/breeder_${NODE_NUM}_uuid"
          done

      - name: Poll Walk Completion
        env:
          KUBECONFIG: /tmp/kind_kubeconfig.yaml
        run: |
          MAX_WAIT=$((${{ fromJSON(inputs.max_wait_minutes) }} * 60))
          ELAPSED=0

          BREEDER_UUIDS=""
          for UF in $(ls /tmp/breeder_*_uuid | sort); do
            BREEDER_UUIDS="${BREEDER_UUIDS} $(cat ${UF})"
          done

          echo "Waiting for all breeders to reach terminal state (walk retired or iteration-capped), watchdog: ${MAX_WAIT}s"

          while [ ${ELAPSED} -lt ${MAX_WAIT} ]; do
            METRICS=$(kubectl exec -n godon deploy/godon-godon-observer -- wget -qO- 'http://localhost:8089/metrics' 2>/dev/null || echo "")
            ALL_DONE=1
            SUMMARY=""
            for BID in ${BREEDER_UUIDS}; do
              RUNNING=$(echo "${METRICS}" | grep "godon_breeder_worker_status{.*breeder_id=\"${BID}\".*status=\"running\"" | grep -oP '\} \K[0-9]+' | grep -c '^1$' || true)
              RUNNING=${RUNNING:-0}
              STOPPED=$(echo "${METRICS}" | grep "godon_breeder_worker_status{.*breeder_id=\"${BID}\".*status=\"stopped\"" | grep -oP '\} \K[0-9]+' | grep -c '^1$' || true)
              STOPPED=${STOPPED:-0}

              if [ "${STOPPED}" -ge 1 ] 2>/dev/null && [ "${RUNNING}" -eq 0 ] 2>/dev/null; then
                STATE=terminal
              else
                STATE=walking
                ALL_DONE=0
              fi
              SUMMARY="${SUMMARY} B${BID:0:8}:${STATE}"
            done

            echo "${SUMMARY} (${ELAPSED}s)"

            if [ "${ALL_DONE}" = "1" ]; then
              echo "All breeders reached terminal state"
              break
            fi

            sleep 30
            ELAPSED=$((ELAPSED + 30))
          done

          if [ ${ELAPSED} -ge ${MAX_WAIT} ]; then
            echo "Watchdog timeout: breeders did not reach terminal state within ${MAX_WAIT}s"
            echo "Budget verdict, not a walk verdict - the curves export below carries per-curve state (converged flags, gaps)"
            exit 1
          fi

      - name: Verify Results
        run: |
          API_URL="http://${{ env.API_HOST }}:${{ env.API_PORT }}"

          for UF in $(ls /tmp/breeder_*_uuid | sort); do
            BID=$(cat ${UF})
            echo "=== Breeder ${BID} Final State ==="
            curl -s "${API_URL}/breeders/${BID}" | jq '.' 2>/dev/null || true
            echo ""
          done

          echo ""
          echo "=== Bench Config (Ground Truth) ==="
          curl -s http://127.0.0.1:8090/config | jq '.' 2>/dev/null || true

          echo ""
          echo "=== Causal Graph (if built) ==="
          CAUSAL_POD=$(kubectl get pods -n godon -l component=godon-causal -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
          if [ -n "${CAUSAL_POD}" ]; then
            kubectl exec -n godon "${CAUSAL_POD}" -- wget -qO- 'http://localhost:8091/graph' 2>/dev/null | jq '.' 2>/dev/null || echo "No graph built"
          fi

      - name: Dump Trial Data
        env:
          KUBECONFIG: /tmp/kind_kubeconfig.yaml
        run: |
          fuser -k 9099/tcp 2>/dev/null || true
          sleep 1
          kubectl port-forward -n godon --address 127.0.0.3 deploy/godon-godon-observer 9099:8089 > /tmp/pf_obs.log 2>&1 &
          sleep 3

          for UF in $(ls /tmp/breeder_*_uuid | sort); do
            BID=$(cat ${UF})
            echo "=== Trials for breeder ${BID} ==="
            curl -s -m 30 "http://127.0.0.3:9099/api/breeders/${BID}/trials" | jq -r '
              if type == "array" then . elif .trials then .trials elif .data then .data else [.] end
              | {complete: (map(select(.state == "COMPLETE")) | length),
                 fail: (map(select(.state == "FAIL")) | length),
                 total: length}
            ' 2>/dev/null || echo "Failed to fetch trials"
          done

      - name: Dump Coordinator Logs
        env:
          KUBECONFIG: /tmp/kind_kubeconfig.yaml
        run: |
          echo "=== Breeder Worker Logs (last 200 lines, coordinator trace) ==="
          for WORKER_POD in $(kubectl get pods -n godon -l workerGroup=breeder -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
            echo "--- ${WORKER_POD} ---"
            kubectl logs -n godon "${WORKER_POD}" --tail=200 2>/dev/null | grep -i "COORD\|PROBE\|CHAR\|CONVERG\|REFINE\|CAUSAL\|SHIFT" | tail -20 || echo "No coordinator lines in kubectl logs"
          done

          echo ""
          echo "=== Causal Logs (last 50 lines) ==="
          CAUSAL_POD=$(kubectl get pods -n godon -l component=causal -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
          if [ -n "${CAUSAL_POD}" ]; then
            kubectl logs -n godon "${CAUSAL_POD}" --tail=50 2>/dev/null | grep -i "probe_result\|characterize\|shift\|delta\|converg" || echo "No relevant causal logs"
          fi

      - name: Diagnose Failure
        if: failure()
        env:
          KUBECONFIG: /tmp/kind_kubeconfig.yaml
        run: |
          API_URL="http://${{ env.API_HOST }}:${{ env.API_PORT }}"

          for UUID_FILE in $(ls /tmp/breeder_*_uuid 2>/dev/null | sort); do
            BID=$(cat ${UUID_FILE} 2>/dev/null || echo "")
            if [ -n "${BID}" ]; then
              echo "--- Breeder ${BID} ---"
              curl -s "${API_URL}/breeders/${BID}" | jq '.' 2>/dev/null || true
            fi
          done

          echo ""
          echo "--- Worker Logs (last 100 lines) ---"
          WORKER_POD=$(kubectl get pods -n godon -l component=breeder -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
          [ -n "${WORKER_POD}" ] && kubectl logs -n godon "${WORKER_POD}" --tail=100 2>/dev/null || true

          echo ""
          echo "--- Bench Logs ---"
          docker logs bench-generic --tail=30 2>&1 || true

          echo ""
          echo "--- All Pods ---"
          kubectl get pods -n godon -o wide 2>/dev/null || true

      - name: Export Curves and Coordinator Trace
        if: always()
        env:
          KUBECONFIG: /tmp/kind_kubeconfig.yaml
        run: |
          echo "=== Response Curves (pre-cleanup export) ==="
          CAUSAL_POD=$(kubectl get pods -n godon -l component=godon-causal -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
          if [ -n "${CAUSAL_POD}" ]; then
            CURVES=$(kubectl exec -n godon "${CAUSAL_POD}" -- wget -qO- 'http://localhost:8091/curves' 2>/dev/null || echo "")
            if [ -n "${CURVES}" ]; then
              echo "${CURVES}" | jq -e '.' && echo "=== /curves export OK ===" || { echo "${CURVES}"; echo "=== /curves not valid JSON ==="; }
            else
              echo "No curves available"
            fi
          else
            echo "No causal pod found"
          fi

          echo ""
          echo "=== Coordinator Trace via Loki (pre-cleanup export) ==="
          # Breeder script logs ship OTLP -> Loki (service_name=godon-breeders),
          # not to kubectl logs. Query the full run window explicitly.
          fuser -k 3100/tcp 2>/dev/null || true
          sleep 1
          kubectl port-forward -n godon-observability svc/godon-observability-loki 3100:3100 > /tmp/pf_loki.log 2>&1 &
          LOKI_PF_PID=$!
          sleep 3
          if curl -s --connect-timeout 3 http://127.0.0.1:3100/ready >/dev/null 2>&1; then
            END=$(date +%s)
            START=$((END - ${{ fromJSON(inputs.max_wait_minutes) }} * 60 - 900))
            curl -s -G "http://127.0.0.1:3100/loki/api/v1/query_range" \
              --data-urlencode 'query={service_name="godon-breeders"}' \
              --data-urlencode "start=${START}" \
              --data-urlencode "end=${END}" \
              --data-urlencode 'direction=forward' \
              --data-urlencode 'limit=5000' > /tmp/loki_breeders.json
            echo "--- flattened trace (ts_ns line) ---"
            jq -r '.data.result[].values[] | "\(.[0]) \(.[1])"' /tmp/loki_breeders.json 2>/dev/null \
              | grep -i "COORD\|PROBE\|CHAR\|CONVERG\|REFINE\|CAUSAL\|SHIFT\|ERROR\|WARN\|Traceback" \
              || echo "No coordinator lines in Loki window"
            echo "--- trace line count (all levels): $(jq -r '.data.result[].values[] | .[1]' /tmp/loki_breeders.json 2>/dev/null | wc -l) (raw remains in Loki) ---"
          else
            echo "Loki not reachable via port-forward"
          fi
          kill ${LOKI_PF_PID} 2>/dev/null || true

      - name: Cleanup
        if: always()
        run: |
          API_URL="http://${{ env.API_HOST }}:${{ env.API_PORT }}"
          CLI_IMAGE="ghcr.io/godon-dev/godon-cli:latest"

          for UUID_FILE in $(ls /tmp/breeder_*_uuid 2>/dev/null | sort); do
            BID=$(cat ${UUID_FILE} 2>/dev/null || echo "")
            if [ -n "${BID}" ]; then
              docker run --rm --network host "${CLI_IMAGE}" \
                --hostname=${{ env.API_HOST }} --port=${{ env.API_PORT }} --insecure \
                breeder purge --force --id="${BID}" 2>/dev/null || true
            fi
          done

          for TID_FILE in $(ls /tmp/target_*_id 2>/dev/null | sort); do
            TID=$(cat ${TID_FILE} 2>/dev/null || echo "")
            if [ -n "${TID}" ]; then
              docker run --rm --network host "${CLI_IMAGE}" \
                --hostname=${{ env.API_HOST }} --port=${{ env.API_PORT }} --insecure \
                target delete --id="${TID}" 2>/dev/null || true
            fi
          done

          docker rm -f bench-generic 2>/dev/null || true

          if [ -f /tmp/pf_pid ]; then
            kill $(cat /tmp/pf_pid) 2>/dev/null || true
            rm /tmp/pf_pid
          fi

      - name: Summary
        if: always()
        run: |
          echo "Bench Characterization Summary"
          echo "Scenario: ${{ inputs.scenario }}"
          echo "Topology: scenario-${{ inputs.scenario }}"
          echo "Breeders: $(ls /tmp/breeder_*_uuid 2>/dev/null | wc -l)"
          echo "Iterations override: ${{ inputs.iterations_max == '' && 'none (conf value stands)' || inputs.iterations_max }}"
          echo "Bench seed: ${{ inputs.seed }}"
          echo "Watchdog: ${{ fromJSON(inputs.max_wait_minutes) }}m"
          echo "Status: ${{ job.status }}"
