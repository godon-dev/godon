name: "Bench Generic-N — the load ladder on the generic bench (one container, N nodes)"

on:
  workflow_dispatch:
    inputs:
      n:
        description: "Number of nodes/tenders (6, 10, 16, 20, 30...)"
        required: false
        default: "6"
      family:
        description: "Topology family: mesh (fully-coupled DAG) | chain (sparse) | fork (hub+receivers) | none (uncoupled control)"
        required: false
        default: "mesh"
      coupling_strength:
        description: "Edge strength (default 0.7)"
        required: false
        default: "0.7"
      noise_gaussian:
        description: "Gaussian noise sigma"
        required: false
        default: "0.02"
      dials_per_node:
        description: "Dials per node (map size per tender)"
        required: false
        default: "1"
      min_trials:
        description: "Trials per tender before the room concludes (meters, not maps)"
        required: false
        default: "200"
      max_wait_minutes:
        description: "Room window"
        required: false
        default: "40"
      push_block_size:
        description: "Push block size"
        required: false
        default: "6"
      pause_block_size:
        description: "Pause block size"
        required: false
        default: "6"

jobs:
  bench-generic-n:
    name: "Generic-N load room: ${{ inputs.n }} nodes, ${{ inputs.family }}"
    runs-on: [self-hosted, linux]
    timeout-minutes: ${{ fromJSON(inputs.max_wait_minutes) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Verify KIND Cluster
        run: |
          if ! kind get clusters | grep -q "godon-1-cluster"; then
            echo "KIND cluster not found."; exit 1
          fi
          kind export kubeconfig --name=godon-1-cluster --kubeconfig=/tmp/kind_kubeconfig.yaml

      - name: Verify Godon Stack
        env:
          KUBECONFIG: /tmp/kind_kubeconfig.yaml
        run: |
          if ! helm status godon --namespace godon >/dev/null 2>&1; then
            echo "Godon stack not found."; exit 1
          fi
          kubectl wait --for=condition=ready pod -l component=api -n godon --timeout=300s

      - name: Generate Topology
        run: |
          python3 examples/bench/scenario-generic-n/gen_topology.py \
            --n ${{ inputs.n }} --family ${{ inputs.family }} \
            --coupling ${{ inputs.coupling_strength }} --dials ${{ inputs.dials_per_node }} \
            --sigma ${{ inputs.noise_gaussian }} > /tmp/topology.yaml
          echo "=== Effective topology (N=${{ inputs.n }}, family=${{ inputs.family }}) ==="
          cat /tmp/topology.yaml

      - name: Start Generic Bench
        run: |
          docker rm -f bench-generic-n 2>/dev/null || true
          docker create \
            --name bench-generic-n \
            --user 0:0 \
            -p 8090:8090 \
            -e CONFIG_PATH=/topology.yaml \
            -e PORT=8090 \
            -e GENERIC_SEED=42 \
            -e RUST_LOG=info \
            ghcr.io/godon-dev/godon-bench-generic:0.5.0
          docker cp /tmp/topology.yaml bench-generic-n:/topology.yaml
          docker start bench-generic-n
          for i in $(seq 1 30); do
            if curl -s -f --connect-timeout 2 http://127.0.0.1:8090/health >/dev/null 2>&1; then
              echo "Bench healthy"; break
            fi
            sleep 2
          done
          docker network connect kind bench-generic-n 2>/dev/null || true
          BENCH_IP=$(docker inspect bench-generic-n -f '{{.NetworkSettings.Networks.kind.IPAddress}}')
          echo "BENCH_IP=${BENCH_IP}" >> $GITHUB_ENV
          curl -s http://127.0.0.1:8090/config | python3 -c "import json,sys; c=json.load(sys.stdin); print('nodes:', len(c['nodes']), 'edges:', len(c['edges']))"

      - name: Point the CLI at the API node port
        run: |
          echo "API_HOST=127.0.0.1" >> $GITHUB_ENV
          echo "API_PORT=32002" >> $GITHUB_ENV
          for i in $(seq 1 15); do
            if curl -s -f --connect-timeout 2 http://127.0.0.1:32002/health >/dev/null 2>&1; then
              echo "API reachable"; break
            fi
            sleep 2
          done

      - name: Create Targets
        run: |
          API_URL="http://${{ env.API_HOST }}:${{ env.API_PORT }}"
          CLI_IMAGE="ghcr.io/godon-dev/godon-cli:latest"
          BENCH_URL="http://${{ env.BENCH_IP }}:8090"
          mkdir -p nt && rm -f nt/target_*
          for i in $(seq 1 ${{ inputs.n }}); do
            NAME="bench-generic-n-node-${i}"
            EXISTING=$(curl -s ${API_URL}/targets | jq -r ".[] | select(.name==\"${NAME}\") | .id" 2>/dev/null || echo "")
            [ -n "${EXISTING}" ] && curl -s -X DELETE ${API_URL}/targets/${EXISTING} >/dev/null 2>&1 || true
            printf 'name: "bench-generic-n-node-%s"\ntargetType: "http"\nspec:\n  url: "%s/node-%s"\n  auth_type: "none"\n' \
              "${i}" "${BENCH_URL}" "${i}" > nt/target_${i}.yaml
            OUT=$(docker run --rm --network host -v $(pwd)/nt:/work:ro -w /work \
              "${CLI_IMAGE}" --hostname=${{ env.API_HOST }} --port=${{ env.API_PORT }} --insecure \
              target create --file=target_${i}.yaml 2>&1 || true)
            echo "${OUT}" >&2
            ID=$(echo "${OUT}" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1)
            [ -z "${ID}" ] && ID=$(curl -s ${API_URL}/targets | jq -r ".[] | select(.name==\"${NAME}\") | .id" 2>/dev/null | head -1)
            [ -z "${ID}" ] && { echo "target ${i} failed"; exit 1; }
            echo "${ID}" > nt/target_${i}.id
          done
          echo "created ${{ inputs.n }} targets"

      - name: Create Systemtenders
        env:
          KUBECONFIG: /tmp/kind_kubeconfig.yaml
        run: |
          API_URL="http://${{ env.API_HOST }}:${{ env.API_PORT }}"
          CLI_IMAGE="ghcr.io/godon-dev/godon-cli:latest"
          BENCH_URL="http://${{ env.BENCH_IP }}:8090"
          # Purge stale rooms of this family, proven gone (godon#409 class)
          EXISTING=$(curl -s ${API_URL}/systemtenders | jq -r '.[] | select(.name | startswith("bench-generic-n")) | .id' 2>/dev/null || echo "")
          for BID in ${EXISTING}; do
            docker run --rm --network host "${CLI_IMAGE}" \
              --hostname=${{ env.API_HOST }} --port=${{ env.API_PORT }} --insecure \
              systemtender purge --force --id="${BID}" 2>&1 || { echo "purge failed ${BID}"; exit 1; }
            for i in $(seq 1 36); do
              STILL=$(curl -s ${API_URL}/systemtenders | jq -r --arg id "${BID}" '.[] | select(.id==$id) | .id' 2>/dev/null || echo "")
              [ -z "${STILL}" ] && break
              sleep 5
            done
            [ -n "${STILL}" ] && { echo "tender ${BID} still listed 180s after purge"; exit 1; }
          done
          rm -f nt/tender_*
          for i in $(seq 1 ${{ inputs.n }}); do
            TID=$(cat nt/target_${i}.id)
            python3 examples/bench/scenario-generic-n/gen_tender.py \
              --recon-url "${BENCH_URL}/node-${i}" --target-id "${TID}" \
              --group bench-generic-n \
              --push ${{ inputs.push_block_size }} --pause ${{ inputs.pause_block_size }} \
              > nt/tender_${i}.yaml
            [ -s nt/tender_${i}.yaml ] || { echo "tender gen ${i} failed"; exit 1; }
            OUT=$(docker run --rm --network host -v $(pwd)/nt:/work:ro -w /work \
              "${CLI_IMAGE}" --hostname=${{ env.API_HOST }} --port=${{ env.API_PORT }} --insecure \
              systemtender create --name="bench-generic-n-${i}" --file=tender_${i}.yaml 2>&1 || true)
            echo "${OUT}" >&2
            UUID=$(echo "${OUT}" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1)
            [ -z "${UUID}" ] && { echo "tender ${i} failed"; exit 1; }
            echo "${UUID}" > nt/tender_${i}.id
          done
          echo "created ${{ inputs.n }} tenders"

      - name: Poll Load
        env:
          KUBECONFIG: /tmp/kind_kubeconfig.yaml
        run: |
          MAX_WAIT=$((${{ fromJSON(inputs.max_wait_minutes) }} * 60))
          ELAPSED=0
          MIN_TRIALS=${{ inputs.min_trials }}
          while [ ${ELAPSED} -lt ${MAX_WAIT} ]; do
            METRICS=$(kubectl exec -n godon deploy/godon-godon-observer -- wget -qO- 'http://localhost:8089/metrics' 2>/dev/null || echo "")
            TOTAL=0; DONE=0
            for f in nt/tender_*.id; do
              UUID=$(cat $f)
              T=$(echo "${METRICS}" | grep "godon_systemtender_total_trials{.*systemtender_id=\"${UUID}\"" | grep -oP '\} \K[0-9]+' || echo 0)
              TOTAL=$((TOTAL+1))
              [ "${T}" -ge "${MIN_TRIALS}" ] 2>/dev/null && DONE=$((DONE+1))
            done
            echo "[${ELAPSED}s] tenders at target: ${DONE}/${TOTAL}"
            [ "${DONE}" -eq "${TOTAL}" ] && { echo "ALL REACHED ${MIN_TRIALS}"; break; }
            sleep 15
            ELAPSED=$((ELAPSED+15))
          done

      - name: Dump Meters
        env:
          KUBECONFIG: /tmp/kind_kubeconfig.yaml
        run: |
          echo "=== per-tender trial counters ==="
          METRICS=$(kubectl exec -n godon deploy/godon-godon-observer -- wget -qO- 'http://localhost:8089/metrics' 2>/dev/null || echo "")
          for f in nt/tender_*.id; do
            UUID=$(cat $f)
            T=$(echo "${METRICS}" | grep "godon_systemtender_total_trials{.*systemtender_id=\"${UUID}\"" | grep -oP '\} \K[0-9]+' || echo 0)
            echo "$(basename $f .id) trials=${T}"
          done
          echo "=== worker memory/CPU (crictl) ==="
          K=/tmp/kubectl
          $K get pods -n godon --kubeconfig /tmp/kind_kubeconfig.yaml --no-headers 2>/dev/null | grep windmill-workers-robot | grep Running | wc -l | xargs echo "robot workers running:"
          crictl stats 2>/dev/null | head -25 || docker stats --no-stream --format "{{.Name}} {{.MemUsage}} {{.CPUPerc}}" 2>/dev/null | head -25 || true

      - name: Cleanup
        if: always()
        run: |
          API_URL="http://${{ env.API_HOST }}:${{ env.API_PORT }}"
          CLI_IMAGE="ghcr.io/godon-dev/godon-cli:latest"
          for f in nt/tender_*.id; do
            [ -f "$f" ] || continue
            BID=$(cat $f)
            docker run --rm --network host "${CLI_IMAGE}" \
              --hostname=${{ env.API_HOST }} --port=${{ env.API_PORT }} --insecure \
              systemtender purge --force --id="${BID}" 2>&1 || echo "purge ${BID} said: $?"
          done
          for f in nt/target_*.id; do
            [ -f "$f" ] || continue
            TID=$(cat $f)
            docker run --rm --network host "${CLI_IMAGE}" \
              --hostname=${{ env.API_HOST }} --port=${{ env.API_PORT }} --insecure \
              target delete --id="${TID}" 2>&1 || true
          done
          docker rm -f bench-generic-n 2>/dev/null || true
          echo "room torn down"
