name: "Bench Generic-N — the load ladder on the generic bench (one container, N nodes)"

on:
  workflow_dispatch:
    inputs:
      n:
        description: "Number of nodes/tenders (6, 10, 16)"
        required: false
        default: "6"
      family:
        description: "Topology family: mesh | none (uncoupled control) — must match a checked-in topology file"
        required: false
        default: "none"
      coupling_strength:
        description: "Edge strength (0.0 | 0.3 | 0.7) — selects the checked-in topology with the family"
        required: false
        default: "0.0"
      min_trials:
        description: "Trials per tender before the room concludes (meters, not maps)"
        required: false
        default: "200"
      max_wait_minutes:
        description: "Room window"
        required: false
        default: "45"
      push_block_size:
        description: "Push block size"
        required: false
        default: "6"
      pause_block_size:
        description: "Pause block size"
        required: false
        default: "6"

jobs:
  bench-generic-n:
    name: "Generic-N load room: ${{ inputs.n }} nodes, ${{ inputs.family }} ${{ inputs.coupling_strength }}"
    runs-on: [self-hosted, linux]
    timeout-minutes: ${{ fromJSON(inputs.max_wait_minutes) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Verify KIND Cluster
        run: |
          if ! kind get clusters | grep -q "godon-1-cluster"; then
            echo "KIND cluster not found."; exit 1
          fi
          kind export kubeconfig --name=godon-1-cluster --kubeconfig=/tmp/kind_kubeconfig.yaml

      - name: Verify Godon Stack
        env:
          KUBECONFIG: /tmp/kind_kubeconfig.yaml
        run: |
          if ! helm status godon --namespace godon >/dev/null 2>&1; then
            echo "Godon stack not found."; exit 1
          fi
          kubectl wait --for=condition=ready pod -l component=api -n godon --timeout=300s
          # the estate doors must answer at all (the 2026-11-17 auth wedge
          # class: everything downstream 500s while the doors are broken)
          curl -s -m 10 http://127.0.0.1:32002/systemtenders >/dev/null || {
            echo "::error::the api's systemtenders door does not answer — estate wedged, refusing to fly"; exit 1;
          }

      - name: Select Topology (checked-in)
        run: |
          TOPO="examples/bench/scenario-generic-n/topologies/${{ inputs.family }}-${{ inputs.coupling_strength }}-n${{ inputs.n }}.yaml"
          [ -f "$TOPO" ] || { echo "::error::no checked-in topology at $TOPO"; exit 1; }
          cp "$TOPO" /tmp/topology.yaml
          echo "=== Room topology: $TOPO ==="
          cat /tmp/topology.yaml

      - name: Purge Stale Rooms, Proven Gone (FIRST — the gate room 2 never reached)
        run: |
          API_URL="http://127.0.0.1:32002"
          CLI_IMAGE="ghcr.io/godon-dev/godon-cli:latest"
          EXISTING=$(curl -s ${API_URL}/systemtenders | jq -r '.[] | select(.name | startswith("bench-generic-n")) | .id' 2>/dev/null || echo "")
          for BID in ${EXISTING}; do
            echo "purging stale ${BID}" >&2
            docker run --rm --network host "${CLI_IMAGE}" --hostname=127.0.0.1 --port=32002 --insecure \
              systemtender purge --force --id="${BID}" 2>&1 || { echo "::error::purge of ${BID} failed"; exit 1; }
            for i in $(seq 1 36); do
              STILL=$(curl -s ${API_URL}/systemtenders | jq -r --arg id "${BID}" '.[] | select(.id==$id) | .id' 2>/dev/null || echo "")
              [ -z "${STILL}" ] && break
              sleep 5
            done
            [ -n "${STILL}" ] && { echo "::error::tender ${BID} still listed 180s after purge — residue refuses to die"; exit 1; }
          done
          for TID in $(curl -s ${API_URL}/targets | jq -r '.[] | select(.name | startswith("bench-generic-n")) | .id' 2>/dev/null || echo ""); do
            docker run --rm --network host "${CLI_IMAGE}" --hostname=127.0.0.1 --port=32002 --insecure \
              target delete --id="${TID}" 2>&1 || true
          done
          echo "estate clean of this family"

      - name: Start Generic Bench
        run: |
          docker rm -f bench-generic-n 2>/dev/null || true
          docker create \
            --name bench-generic-n \
            --user 0:0 \
            -p 8090:8090 \
            -e CONFIG_PATH=/topology.yaml \
            -e PORT=8090 \
            -e GENERIC_SEED=42 \
            -e RUST_LOG=info \
            ghcr.io/godon-dev/godon-bench-generic:0.5.0
          docker cp /tmp/topology.yaml bench-generic-n:/topology.yaml
          docker start bench-generic-n
          for i in $(seq 1 30); do
            if curl -s -f --connect-timeout 2 http://127.0.0.1:8090/health >/dev/null 2>&1; then
              echo "Bench healthy"; break
            fi
            sleep 2
          done
          docker network connect kind bench-generic-n 2>/dev/null || true
          BENCH_IP=$(docker inspect bench-generic-n -f '{{.NetworkSettings.Networks.kind.IPAddress}}')
          echo "BENCH_IP=${BENCH_IP}" >> $GITHUB_ENV
          curl -s http://127.0.0.1:8090/config | python3 -c "import json,sys; c=json.load(sys.stdin); print('nodes:', len(c['nodes']), 'edges:', len(c['edges']))"

      - name: Create Targets (template seds, retried)
        run: |
          API_URL="http://127.0.0.1:32002"
          CLI_IMAGE="ghcr.io/godon-dev/godon-cli:latest"
          BENCH_URL="http://${{ env.BENCH_IP }}:8090"
          mkdir -p nt && rm -f nt/*
          for i in $(seq 1 ${{ inputs.n }}); do
            sed -e "s|__BENCH_URL__|${BENCH_URL}|g" -e "s|__I__|${i}|g" \
              examples/bench/scenario-generic-n/targets/node.yaml > nt/target_${i}.yaml
            chmod 644 nt/target_${i}.yaml
            ID=""
            for ATTEMPT in 1 2 3; do
              OUT=$(docker run --rm --network host -v $(pwd)/nt:/work:ro -w /work \
                "${CLI_IMAGE}" --hostname=127.0.0.1 --port=32002 --insecure \
                target create --file=target_${i}.yaml 2>&1 || true)
              ID=$(echo "${OUT}" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1)
              # async-accept prints no id; a 409 means an earlier attempt WON —
              # the list-by-name fallback adopts our own row either way
              [ -z "${ID}" ] && ID=$(curl -s -m 10 ${API_URL}/targets | jq -r ".[] | select(.name==\"bench-generic-n-node-${i}\") | .id" 2>/dev/null | head -1)
              [ -n "${ID}" ] && break
              echo "target ${i} attempt ${ATTEMPT} failed: ${OUT}" >&2
              sleep 5
            done
            [ -z "${ID}" ] && { echo "::error::target ${i} failed after 3 attempts"; exit 1; }
            echo "${ID}" > nt/target_${i}.id
          done
          echo "created ${{ inputs.n }} targets"

      - name: Create Systemtenders (template seds, retried)
        run: |
          CLI_IMAGE="ghcr.io/godon-dev/godon-cli:latest"
          BENCH_URL="http://${{ env.BENCH_IP }}:8090"
          for i in $(seq 1 ${{ inputs.n }}); do
            TID=$(cat nt/target_${i}.id)
            sed -e "s|__BENCH_URL__|${BENCH_URL}|g" -e "s|__I__|${i}|g" \
                -e "s|__TARGET_ID__|${TID}|g" \
                -e "s|__PUSH__|${{ inputs.push_block_size }}|" -e "s|__PAUSE__|${{ inputs.pause_block_size }}|" \
                examples/bench/scenario-generic-n/systemtenders/systemtender.yaml > nt/tender_${i}.yaml
            chmod 644 nt/tender_${i}.yaml
            UUID=""
            for ATTEMPT in 1 2 3; do
              OUT=$(docker run --rm --network host -v $(pwd)/nt:/work:ro -w /work \
                "${CLI_IMAGE}" --hostname=127.0.0.1 --port=32002 --insecure \
                systemtender create --name="bench-generic-n-${i}" --file=tender_${i}.yaml 2>&1 || true)
              UUID=$(echo "${OUT}" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1)
              # async-accept prints no id; a 409 means an earlier attempt WON —
              # adopt our own row by name (the gate proved the estate clean
              # before we started, so a name hit here is ours)
              [ -z "${UUID}" ] && UUID=$(curl -s -m 10 http://127.0.0.1:32002/systemtenders | jq -r ".[] | select(.name==\"bench-generic-n-${i}\") | .id" 2>/dev/null | head -1)
              [ -n "${UUID}" ] && break
              echo "tender ${i} attempt ${ATTEMPT} failed: ${OUT}" >&2
              sleep 5
            done
            [ -z "${UUID}" ] && { echo "::error::tender ${i} failed after 3 attempts"; exit 1; }
            echo "${UUID}" > nt/tender_${i}.id
          done
          echo "created ${{ inputs.n }} tenders"

      - name: Poll Load
        env:
          KUBECONFIG: /tmp/kind_kubeconfig.yaml
        run: |
          MAX_WAIT=$((${{ fromJSON(inputs.max_wait_minutes) }} * 60))
          ELAPSED=0
          MIN_TRIALS=${{ inputs.min_trials }}
          while [ ${ELAPSED} -lt ${MAX_WAIT} ]; do
            METRICS=$(kubectl exec -n godon deploy/godon-godon-observer -- wget -qO- 'http://localhost:8089/metrics' 2>/dev/null || echo "")
            TOTAL=0; DONE=0
            for f in nt/tender_*.id; do
              UUID=$(cat $f)
              T=$(echo "${METRICS}" | grep "godon_systemtender_total_trials{.*systemtender_id=\"${UUID}\"" | grep -oP '\} \K[0-9]+' || echo 0)
              TOTAL=$((TOTAL+1))
              [ "${T}" -ge "${MIN_TRIALS}" ] 2>/dev/null && DONE=$((DONE+1))
            done
            echo "[${ELAPSED}s] tenders at target: ${DONE}/${TOTAL}"
            [ "${DONE}" -eq "${TOTAL}" ] && { echo "ALL REACHED ${MIN_TRIALS}"; break; }
            sleep 15
            ELAPSED=$((ELAPSED+15))
          done

      - name: Dump Meters
        env:
          KUBECONFIG: /tmp/kind_kubeconfig.yaml
        run: |
          echo "=== per-tender trial counters ==="
          METRICS=$(kubectl exec -n godon deploy/godon-godon-observer -- wget -qO- 'http://localhost:8089/metrics' 2>/dev/null || echo "")
          for f in nt/tender_*.id; do
            UUID=$(cat $f)
            T=$(echo "${METRICS}" | grep "godon_systemtender_total_trials{.*systemtender_id=\"${UUID}\"" | grep -oP '\} \K[0-9]+' || echo 0)
            echo "$(basename $f .id) trials=${T}"
          done

      - name: Cleanup (verified gone, fails red)
        if: always()
        run: |
          API_URL="http://127.0.0.1:32002"
          CLI_IMAGE="ghcr.io/godon-dev/godon-cli:latest"
          docker rm -f bench-generic-n 2>/dev/null || true
          for f in nt/tender_*.id; do
            [ -f "$f" ] || continue
            BID=$(cat $f)
            docker run --rm --network host "${CLI_IMAGE}" --hostname=127.0.0.1 --port=32002 --insecure \
              systemtender purge --force --id="${BID}" 2>&1 || echo "purge ${BID} errored (continuing to verify)"
          done
          sleep 12
          for i in $(seq 1 36); do
            LEFT=$(curl -s -m 15 ${API_URL}/systemtenders | jq -r '[.[] | select(.name | startswith("bench-generic-n"))] | length' 2>/dev/null || echo "?")
            [ "${LEFT}" = "0" ] && break
            sleep 5
          done
          if [ "${LEFT}" != "0" ]; then
            # the known quiet-tender delete-wedge: re-DELETE clears it in ~40s
            # (banked pitfall — always the walked one). One more purge each.
            echo "${LEFT} wedged — re-deleting each once"
            for BID in $(curl -s -m 15 ${API_URL}/systemtenders | jq -r '.[] | select(.name | startswith("bench-generic-n")) | .id' 2>/dev/null); do
              docker run --rm --network host "${CLI_IMAGE}" --hostname=127.0.0.1 --port=32002 --insecure \
                systemtender purge --force --id="${BID}" 2>&1 || echo "re-delete ${BID} errored"
            done
            for i in $(seq 1 24); do
              LEFT=$(curl -s -m 15 ${API_URL}/systemtenders | jq -r '[.[] | select(.name | startswith("bench-generic-n"))] | length' 2>/dev/null || echo "?")
              [ "${LEFT}" = "0" ] && break
              sleep 5
            done
          fi
          [ "${LEFT}" = "0" ] || { echo "::error::${LEFT} tenders of this family still listed after cleanup — residue survives, job goes red"; exit 1; }
          for f in nt/target_*.id; do
            [ -f "$f" ] || continue
            TID=$(cat $f)
            docker run --rm --network host "${CLI_IMAGE}" --hostname=127.0.0.1 --port=32002 --insecure \
              target delete --id="${TID}" 2>&1 || true
          done
          echo "room torn down, verified clean"
