name: "Verify Coordination Cleanup"

on:
  workflow_dispatch:

jobs:
  verify:
    name: "Check coordination tables in archive_db"
    runs-on: [self-hosted, linux]
    timeout-minutes: 5

    steps:
      - name: Setup kubeconfig
        run: |
          kind export kubeconfig --name=godon-1-cluster --kubeconfig=/tmp/kind_kubeconfig.yaml

      - name: Query coordination tables
        env:
          KUBECONFIG: /tmp/kind_kubeconfig.yaml
        run: |
          YB_POD=$(kubectl get pods -n godon -l app.kubernetes.io/name=yugabyte -l yugabyte.io/type=tserver -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
          if [ -z "${YB_POD}" ]; then
            YB_POD=$(kubectl get pods -n godon -l app=yb-tserver -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
          fi
          if [ -z "${YB_POD}" ]; then
            echo "Looking for tserver pod..."
            kubectl get pods -n godon | grep tserver
            YB_POD=$(kubectl get pods -n godon | grep tserver | head -1 | awk '{print $1}')
          fi
          echo "YugaByte pod: ${YB_POD}"

          echo ""
          echo "=== sender_lease ==="
          kubectl exec -n godon "${YB_POD}" -- /home/yugabyte/postgres/bin/psql -h localhost -p 5433 -U yugabyte -d archive_db -c "SELECT * FROM sender_lease;" 2>/dev/null || \
          kubectl exec -n godon "${YB_POD}" -- ysqlsh -h localhost -p 5433 -U yugabyte -d archive_db -c "SELECT * FROM sender_lease;" 2>/dev/null || \
          echo "Could not query sender_lease"

          echo ""
          echo "=== detection_readiness ==="
          kubectl exec -n godon "${YB_POD}" -- /home/yugabyte/postgres/bin/psql -h localhost -p 5433 -U yugabyte -d archive_db -c "SELECT * FROM detection_readiness;" 2>/dev/null || \
          kubectl exec -n godon "${YB_POD}" -- ysqlsh -h localhost -p 5433 -U yugabyte -d archive_db -c "SELECT * FROM detection_readiness;" 2>/dev/null || \
          echo "Could not query detection_readiness"

          echo ""
          echo "=== interference_active_breeders ==="
          kubectl exec -n godon "${YB_POD}" -- /home/yugabyte/postgres/bin/psql -h localhost -p 5433 -U yugabyte -d archive_db -c "SELECT * FROM interference_active_breeders;" 2>/dev/null || \
          kubectl exec -n godon "${YB_POD}" -- ysqlsh -h localhost -p 5433 -U yugabyte -d archive_db -c "SELECT * FROM interference_active_breeders;" 2>/dev/null || \
          echo "Could not query interference_active_breeders"

      - name: Query Loki for controller cleanup logs
        env:
          KUBECONFIG: /tmp/kind_kubeconfig.yaml
        run: |
          LOKI_POD=$(kubectl get pods -n godon-observability -l app.kubernetes.io/name=loki -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
          if [ -z "${LOKI_POD}" ]; then
            LOKI_POD=$(kubectl get pods -A | grep loki | head -1 | awk '{print $2}')
          fi
          LOKI_NS=$(kubectl get pods -A | grep loki | head -1 | awk '{print $1}')
          echo "Loki pod: ${LOKI_POD} in ${LOKI_NS}"

          if [ -n "${LOKI_POD}" ]; then
            kubectl port-forward -n "${LOKI_NS}" "${LOKI_POD}" 3100:3100 > /tmp/loki_pf.log 2>&1 &
            sleep 3

            echo "=== Controller cleanup logs (last 30 min) ==="
            curl -s -G "http://localhost:3100/loki/api/v1/query_range" \
              --data-urlencode 'query{|= "coordination" or |= "cleanup" or |= "Purged" or |= "group lease"}' \
              --data-urlencode "limit=30" \
              --data-urlencode "start=$(date -d '30 minutes ago' +%s)000000000" \
              --data-urlencode "end=$(date +%s)000000000" | jq -r '.data.result[]?.values[]? | .[1]' 2>/dev/null || echo "Loki query failed or no results"

            echo ""
            echo "=== Coordinator logs (last 30 min) ==="
            curl -s -G "http://localhost:3100/loki/api/v1/query_range" \
              --data-urlencode 'query{|= "COORDINATOR" or |= "Acquired lease" or |= "Released" or |= "HOLD_CALIB" or |= "PUSH:" or |= "PAUSE:"}' \
              --data-urlencode "limit=30" \
              --data-urlencode "start=$(date -d '30 minutes ago' +%s)000000000" \
              --data-urlencode "end=$(date +%s)000000000" | jq -r '.data.result[]?.values[]? | .[1]' 2>/dev/null || echo "Loki query failed or no results"

            kill %1 2>/dev/null || true
          fi
